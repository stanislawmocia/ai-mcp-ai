services:
  # ──── Always-on hub services (run on your main server) ────

  hub-core:
    build:
      context: .
      dockerfile: packages/hub-core/Dockerfile
    ports:
      - "${BIND_HOST:-127.0.0.1}:7433:7433"
    volumes:
      - hub_data:/data
      - ${TLS_CERT_DIR:-./certs}:/certs:ro
    environment:
      HUB_TOKEN: ${HUB_TOKEN}
      DB_PATH: /data/hub.db
      HUB_PORT: "7433"
      BIND_HOST: "0.0.0.0"
      TLS_CERT: ${TLS_CERT:-}
      TLS_KEY: ${TLS_KEY:-}
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:7433/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  hub-mcp:
    build:
      context: .
      dockerfile: packages/hub-mcp/Dockerfile
    ports:
      - "${BIND_HOST:-127.0.0.1}:7434:7434"
    depends_on:
      hub-core:
        condition: service_healthy
    volumes:
      - ${TLS_CERT_DIR:-./certs}:/certs:ro
    environment:
      HUB_URL: http://hub-core:7433
      HUB_TOKEN: ${HUB_TOKEN}
      MCP_PORT: "7434"
      MCP_TRANSPORT: sse
      BIND_HOST: "0.0.0.0"
      TLS_CERT: ${TLS_CERT:-}
      TLS_KEY: ${TLS_KEY:-}
      # OAuth settings — generate with: openssl rand -hex 32
      OAUTH_CLIENT_ID: ${OAUTH_CLIENT_ID:-}
      OAUTH_CLIENT_SECRET: ${OAUTH_CLIENT_SECRET:-}
      OAUTH_ALLOWED_IPS: ${OAUTH_ALLOWED_IPS:-}
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:7434/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  # ──── Node agent (one per machine) ────
  # On the hub server itself, runs with host networking for Tailscale access.
  # For remote machines, use: docker-compose.node.yml

  node-agent-local:
    build:
      context: .
      dockerfile: packages/node-agent/Dockerfile
    network_mode: host
    profiles: ["with-local-node"]
    environment:
      NODE_NAME: ${NODE_NAME:-hub-server}
      HUB_URL: http://localhost:7433
      HUB_TOKEN: ${HUB_TOKEN}
      AGENT_PORT: "7432"
      BIND_HOST: ${BIND_HOST:-127.0.0.1}
      EXEC_ALLOWLIST: ${EXEC_ALLOWLIST:-}
      EXEC_DENYLIST: ${EXEC_DENYLIST:-}
      EXEC_ALLOWED_WORKDIRS: ${EXEC_ALLOWED_WORKDIRS:-}
      TLS_CERT: ${TLS_CERT:-}
      TLS_KEY: ${TLS_KEY:-}
    volumes:
      - agent_logs:/tmp/meshmind-agents
      - /var/run/docker.sock:/var/run/docker.sock:ro
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    depends_on:
      hub-core:
        condition: service_healthy

volumes:
  hub_data:
  agent_logs:
