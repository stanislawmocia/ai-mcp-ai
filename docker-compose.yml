services:
  hub-core:
    build:
      context: .
      dockerfile: packages/hub-core/Dockerfile
    ports:
      - "7433:7433"
    volumes:
      - hub_data:/data
    environment:
      HUB_TOKEN: ${HUB_TOKEN}
      DB_PATH: /data/hub.db
      HUB_PORT: "7433"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:7433/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  hub-mcp:
    build:
      context: .
      dockerfile: packages/hub-mcp/Dockerfile
    ports:
      - "7434:7434"
    depends_on:
      hub-core:
        condition: service_healthy
    environment:
      HUB_URL: http://hub-core:7433
      HUB_TOKEN: ${HUB_TOKEN}
      MCP_PORT: "7434"
      MCP_TRANSPORT: sse
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:7434/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  node-agent-hp:
    build:
      context: .
      dockerfile: packages/node-agent/Dockerfile
    network_mode: host
    environment:
      NODE_NAME: hp-server
      HUB_URL: http://localhost:7433
      HUB_TOKEN: ${HUB_TOKEN}
      AGENT_PORT: "7432"
    restart: unless-stopped
    depends_on:
      hub-core:
        condition: service_healthy

volumes:
  hub_data:
