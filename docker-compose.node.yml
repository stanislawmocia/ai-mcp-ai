# Standalone docker-compose for remote node-agent
# Deploy this on any machine you want to add to the mesh
#
# Usage:
#   HUB_URL=http://<hub-tailscale-ip>:7433 \
#   HUB_TOKEN=<your-token> \
#   NODE_NAME=<machine-name> \
#   docker compose -f docker-compose.node.yml up -d

services:
  node-agent:
    image: ghcr.io/stanislawmocia/meshmind-node:latest
    build:
      context: .
      dockerfile: packages/node-agent/Dockerfile
    network_mode: host
    environment:
      NODE_NAME: ${NODE_NAME:-node}
      HUB_URL: ${HUB_URL}
      HUB_TOKEN: ${HUB_TOKEN}
      AGENT_PORT: ${AGENT_PORT:-7432}
    volumes:
      - agent_logs:/tmp/meshmind-agents
    restart: unless-stopped

volumes:
  agent_logs:
